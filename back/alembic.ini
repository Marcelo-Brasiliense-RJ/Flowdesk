# I4: configuração do Alembic. A URL do banco vem de env.py (usa o engine do app,
# que honra SUPABASE_DB_URL/DATABASE_URL ou o SQLite local). Este scaffolding é
# ADITIVO: o main.py NÃO importa Alembic; o boot atual segue igual. Em deploy, rode
# `alembic upgrade head` como passo de migração.
[alembic]
script_location = alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
