name: Deploy no Easypanel

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Chamar webhook de deploy do Easypanel
        env:
          EASYPANEL_DEPLOY_HOMOLOGACAO_URL: ${{ secrets.EASYPANEL_DEPLOY_HOMOLOGACAO_URL }}
        run: |
          curl -fsS -X POST \
            --connect-timeout 30 \
            --max-time 120 \
            --retry 5 \
            --retry-delay 15 \
            --retry-all-errors \
            "$EASYPANEL_DEPLOY_HOMOLOGACAO_URL"