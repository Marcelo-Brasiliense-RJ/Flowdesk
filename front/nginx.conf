server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # aceita uploads grandes (planilhas, PDFs) enviados aos Forms
    client_max_body_size 100m;

    # API do FastAPI. proxy_buffering off preserva o streaming do Smart Chat (SSE).
    location /api/ {
        proxy_pass http://back:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # WebSocket do monitor em tempo real
    location /ws/ {
        proxy_pass http://back:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA: qualquer outra rota cai no index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
